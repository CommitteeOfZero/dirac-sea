name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_qt:
        description: "Force Qt rebuild (ignore/bypass Qt cache)"
        type: boolean
        default: false
      rebuild_ifw:
        description: "Force clean IFW build (ignore IFW object cache)"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Resolve cache key inputs
        id: keys
        shell: bash
        run: |
          echo "vcpkg_sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "qt_sha=$(git -C qt rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # vcpkg installed packages
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vcpkg_sha }}-${{ hashFiles('scripts/lib/common.py', 'scripts/lib/vcpkg.py') }}

      - name: Build vcpkg deps
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build.py --stage vcpkg

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # Qt static build.
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: matrix.os == 'windows-latest' 
        with:
          arch: x64

      - name: Restore Qt cache
        id: qt-cache
        if: github.event.inputs.rebuild_qt != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dist/qt-static
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.qt_sha }}-${{ hashFiles('scripts/lib/common.py', 'scripts/lib/qt.py') }}

      - name: Restore qt modules cache
        id: qt-modules-cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            qt/qt*
          key: qt-modules-${{ runner.os }}-${{ steps.keys.outputs.qt_sha }}

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build.py --stage qt ${{ github.event.inputs.rebuild_qt == 'true' && '--rebuild-qt' || '' }}

      - name: Save qt modules cache
        if: steps.qt-cache.outputs.cache-hit != 'true' && steps.qt-modules-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            qt/qt*
          key: ${{ steps.qt-modules-cache.outputs.cache-primary-key }}

      - name: Save Qt cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/qt-static
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      # IFW.
      - name: Restore IFW build cache
        if: steps.qt-cache.outputs.cache-hit == 'true' && github.event.inputs.rebuild_ifw != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/ifw
          key: ifw-obj-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ifw-obj-${{ runner.os }}-${{ runner.arch }}-

      - name: Build IFW
        run: python3 scripts/build.py --stage ifw

      - name: Save IFW build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/ifw
          key: ifw-obj-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      # Installer
      - name: Build hybrid installer
        run: python3 scripts/build_installer.py --excluded-packages com.committeeofzero.cclcc.ps4.patch.jpn com.committeeofzero.cclcc.ps4.patch.eng com.committeeofzero.chlcc.ps3.patch.jpn com.committeeofzero.chlcc.ps3.patch.eng
 
      - name: Build online-only installer
        run: python3 scripts/build_installer.py --online-only --excluded-packages com.committeeofzero.cclcc.ps4.patch.jpn com.committeeofzero.cclcc.ps4.patch.eng com.committeeofzero.chlcc.ps3.patch.jpn com.committeeofzero.chlcc.ps3.patch.eng
 
      - name: Upload IFW Tooling Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifw-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/qt-static/bin/archivegen*
            dist/qt-static/bin/installerbase*
            dist/qt-static/bin/devtool*
            dist/qt-static/bin/repogen*
            dist/qt-static/bin/binarycreator*
          if-no-files-found: error

      - name: Upload hybrid installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ImpactoInstaller
            dist/ImpactoInstaller.app
            dist/ImpactoInstaller.exe
          if-no-files-found: error
 
      - name: Upload web installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-web-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ImpactoInstallerWeb
            dist/ImpactoInstallerWeb.app
            dist/ImpactoInstallerWeb.exe
          if-no-files-found: error
