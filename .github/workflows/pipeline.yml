name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_qt:
        description: "Force Qt rebuild (ignore/bypass Qt cache)"
        type: boolean
        default: false
      rebuild_ifw:
        description: "Force clean IFW build (ignore IFW object cache)"
        type: boolean
        default: false
      publish_release:
        description: "Publish a GitHub release and commit the updates/ repo"
        type: boolean
        default: false
      release_tag:
        description: "Tag name for the release (required if publish_release is checked)"
        type: string
        default: ""


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build Linux Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt install \
            libfontconfig1-dev \
            libfreetype-dev \
            libgtk-3-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-util-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb1-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev

      - name: Resolve cache key inputs
        id: keys
        shell: bash
        run: |
          echo "vcpkg_sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "qt_sha=$(git -C qt rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # vcpkg installed packages
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.vcpkg_sha }}-${{ hashFiles('scripts/lib/common.py', 'scripts/lib/vcpkg.py') }}

      - name: Build vcpkg deps
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build.py --stage vcpkg

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/packages
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      # Qt static build.
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: matrix.os == 'windows-latest' 
        with:
          arch: x64

      - name: Restore Qt cache
        id: qt-cache
        if: github.event.inputs.rebuild_qt != 'true'
        uses: actions/cache/restore@v4
        with:
          path: dist/qt-static
          key: qt-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.qt_sha }}-${{ hashFiles('scripts/lib/common.py', 'scripts/lib/qt.py') }}

      - name: Build Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build.py --stage qt ${{ github.event.inputs.rebuild_qt == 'true' && '--rebuild-qt' || '' }}

      - name: Save Qt cache
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/qt-static
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      # IFW.
      - name: Restore IFW build cache
        if: steps.qt-cache.outputs.cache-hit == 'true' && github.event.inputs.rebuild_ifw != 'true'
        uses: actions/cache/restore@v4
        with:
          path: build/ifw
          key: ifw-obj-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ifw-obj-${{ runner.os }}-${{ runner.arch }}-

      - name: Build IFW
        run: python3 scripts/build.py --stage ifw

      - name: Save IFW build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build/ifw
          key: ifw-obj-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      # Installer
      - name: Build hybrid installer
        run: python3 scripts/build.py --stage installer --excluded-packages com.committeeofzero.cclcc.ps4.patch.jpn com.committeeofzero.cclcc.ps4.patch.eng com.committeeofzero.chlcc.ps3.patch.jpn com.committeeofzero.chlcc.ps3.patch.eng
 
      - name: Build online-only installer
        run: python3 scripts/build.py --stage installer --online-only --excluded-packages com.committeeofzero.cclcc.ps4.patch.jpn com.committeeofzero.cclcc.ps4.patch.eng com.committeeofzero.chlcc.ps3.patch.jpn com.committeeofzero.chlcc.ps3.patch.eng
 
      - name: Upload IFW Tooling Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifw-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/qt-static/bin/archivegen*
            dist/qt-static/bin/installerbase*
            dist/qt-static/bin/devtool*
            dist/qt-static/bin/repogen*
            dist/qt-static/bin/binarycreator*
          if-no-files-found: error

      - name: Rename installer files with platform suffix
        shell: bash
        run: |
          suffix="${{ runner.os }}-${{ runner.arch }}"
          installers=(
            "ImpactoInstaller"
            "ImpactoInstallerWeb"
          )

          extensions=(
            ""
            ".exe"
            ".dmg"
          )

          for installer in "${installers[@]}"; do
            for extension in "${extensions[@]}"; do
              source="dist/${installer}${extension}"

              if [ -f "$source" ]; then
                destination="dist/${installer}-${suffix}${extension}"
                mv "$source" "$destination"
              fi
            done
          done

      - name: Upload hybrid installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ImpactoInstaller-*
          if-no-files-found: error
 
      - name: Upload web installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-web-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/ImpactoInstallerWeb-*
          if-no-files-found: error

      # platform independent
      - name: Upload updates repository
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: updates-repo
          path: updates/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps: 
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Checkout updates branch
        uses: actions/checkout@v4
        with:
          ref: updates
          path: updates-branch
          fetch-depth: 1

      - name: Remove stale updates repository
        run: rm -rf updates-branch/updates

      - name: Sync updates repository
        uses: actions/download-artifact@v4
        with:
          name: updates-repo
          path: updates-branch/updates
 
      - name: Commit and push updates repository
        working-directory: updates-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update repository for ${{ github.event.inputs.release_tag }}"
          git push

